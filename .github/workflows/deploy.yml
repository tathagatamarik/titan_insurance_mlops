name: Build and Deploy to AKS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Azure Container Registry Login
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.ACR_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build . -t ${{ secrets.ACR_SERVER }}/insurance-model:${{ github.sha }}
        docker build . -t ${{ secrets.ACR_SERVER }}/insurance-model:latest
        docker push ${{ secrets.ACR_SERVER }}/insurance-model:${{ github.sha }}
        docker push ${{ secrets.ACR_SERVER }}/insurance-model:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS Context
      uses: azure/aks-set-context@v3
      with:
        resource-group: TitanInsuranceRG
        cluster-name: TitanCluster

    - name: Deploy to Kubernetes
      uses: azure/k8s-deploy@v4
      with:
        action: deploy
        manifests: |
          kubernetes/deployment.yaml
        images: |
          ${{ secrets.ACR_SERVER }}/insurance-model:${{ github.sha }}