name: Build and Push to Azure ACR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the code
    - uses: actions/checkout@v3

    # 2. Log in to Azure Container Registry
    - name: Azure Container Registry Login
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.ACR_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Build the Docker image
    - name: Build Docker Image
      run: |
        docker build . -t ${{ secrets.ACR_SERVER }}/insurance-model:${{ github.sha }}
        docker build . -t ${{ secrets.ACR_SERVER }}/insurance-model:latest

    # 4. Push the Docker image to Azure
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.ACR_SERVER }}/insurance-model:${{ github.sha }}
        docker push ${{ secrets.ACR_SERVER }}/insurance-model:latest